schema: spec-driven

context: |
  Project: "ThreeChoice" (3 choice), a CoastNCode project.
  Frontend-only, no backend: TypeScript + React (Vite).
  Concept: a single site with a home page offering 3 clickable options.
  Each option leads to a distinct sample website built for a friend, so
  they can browse all 3 and pick the one they like as the direction for
  their real site.
  This is a for-fun project that may grow into something real later.

